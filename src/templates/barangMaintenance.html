<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 32px; color: #333; font-size: 13px; }

    .header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid #e67e22; padding-bottom: 12px; }
    .header h1 { font-size: 20px; color: #e67e22; }
    .header p { font-size: 12px; color: #888; margin-top: 4px; }

    .info { margin-bottom: 16px; font-size: 12px; color: #555; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    thead tr { background: #e67e22; color: white; }
    th { padding: 9px 10px; text-align: left; font-size: 12px; }
    td { padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 12px; }
    tr:nth-child(even) td { background: #fdf6ee; }

    .badge-proses {
      display: inline-block; padding: 2px 8px;
      border-radius: 12px; font-size: 11px;
      background: #fff3cd; color: #856404;
    }
    .badge-selesai {
      display: inline-block; padding: 2px 8px;
      border-radius: 12px; font-size: 11px;
      background: #d4edda; color: #155724;
    }

    .summary { margin-top: 16px; text-align: right; font-size: 13px; }
    .summary span { font-weight: bold; color: #e67e22; }
    .footer { margin-top: 32px; font-size: 11px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Data Barang Maintenance</h1>
    <p>Dicetak pada: {{printDate}}</p>
  </div>

  <div class="info">
    Total maintenance: <strong>{{totalMaintenance}}</strong> item
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Kode Barang</th>
        <th>Nama Barang</th>
        <th>Jumlah</th>
        <th>Tanggal Maintenance</th>
        <th>Tanggal Selesai</th>
        <th>Status</th>
        <th>Keterangan</th>
      </tr>
    </thead>
    <tbody>
      {{tableRows}}
    </tbody>
  </table>

  <div class="summary">
    Total item: <span>{{totalMaintenance}}</span>
  </div>

  <div class="footer">
    Dokumen ini digenerate otomatis oleh sistem &mdash; {{printDate}}
  </div>

</body>
</html>
