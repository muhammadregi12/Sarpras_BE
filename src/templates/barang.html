<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 32px; color: #333; font-size: 13px; }

    .header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid #1a73e8; padding-bottom: 12px; }
    .header h1 { font-size: 20px; color: #1a73e8; }
    .header p { font-size: 12px; color: #888; margin-top: 4px; }

    .info { margin-bottom: 16px; font-size: 12px; color: #555; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    thead tr { background: #1a73e8; color: white; }
    th { padding: 9px 10px; text-align: left; font-size: 12px; }
    td { padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 12px; }
    tr:nth-child(even) td { background: #f5f9ff; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #e8f0fe;
      color: #1a73e8;
    }

    .footer { margin-top: 32px; font-size: 11px; color: #aaa; text-align: center; }
    .summary { margin-top: 16px; text-align: right; font-size: 13px; }
    .summary span { font-weight: bold; color: #1a73e8; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Data Barang</h1>
    <p>Dicetak pada: {{printDate}}</p>
  </div>

  <div class="info">
    Total barang: <strong>{{totalBarang}}</strong> item
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Kode Barang</th>
        <th>Nama Barang</th>
        <th>Kategori</th>
        <th>Ruangan</th>
        <th>Cabang</th>
        <th>Jumlah</th>
        <th>Satuan</th>
        <th>Tahun Pengadaan</th>
        <th>Keterangan</th>
      </tr>
    </thead>
    <tbody>
      {{tableRows}}
    </tbody>
  </table>

  <div class="summary">
    Total item: <span>{{totalBarang}}</span>
  </div>

  <div class="footer">
    Dokumen ini digenerate otomatis oleh sistem &mdash; {{printDate}}
  </div>

</body>
</html>
